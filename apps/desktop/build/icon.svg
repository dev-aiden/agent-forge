<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Kitroom app icon: a kit case holding four items (agents, skills, rules, MCP servers). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="600" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#ea580c" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="o" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f97316"/><stop offset="1" stop-color="#fdba74"/></linearGradient>
    <linearGradient id="t" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#5eead4"/></linearGradient>
    <linearGradient id="v" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
    <linearGradient id="y" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#eab308"/><stop offset="1" stop-color="#fde047"/></linearGradient>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
  </g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- handle -->
  <path d="M418 330 L418 288 Q418 252 454 252 L570 252 Q606 252 606 288 L606 330" fill="none" stroke="url(#case)" stroke-width="40" stroke-linecap="round"/>
  <!-- case -->
  <rect x="236" y="320" width="552" height="456" rx="64" fill="url(#case)"/>
  <rect x="280" y="364" width="464" height="368" rx="32" fill="url(#inner)"/>
  <!-- four kit items -->
  <rect x="314" y="398" width="182" height="134" rx="26" fill="url(#o)"/>
  <rect x="528" y="398" width="182" height="134" rx="26" fill="url(#t)"/>
  <rect x="314" y="564" width="182" height="134" rx="26" fill="url(#v)"/>
  <rect x="528" y="564" width="182" height="134" rx="26" fill="url(#y)"/>
</svg>
