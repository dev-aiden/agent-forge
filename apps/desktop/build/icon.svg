<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Kitroom app icon: an anvil with connected agent nodes rising like sparks. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="760" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#ea580c" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="anvil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#fde047"/>
    </linearGradient>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>
  </g>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- agent nodes -->
  <g stroke="url(#spark)" stroke-width="22" stroke-linecap="round" fill="none">
    <path d="M392 392 L512 292 L632 392"/>
  </g>
  <g fill="url(#spark)">
    <circle cx="392" cy="392" r="42"/>
    <circle cx="512" cy="292" r="50"/>
    <circle cx="632" cy="392" r="42"/>
  </g>

  <!-- anvil -->
  <path fill="url(#anvil)" d="
    M 236 478
    C 288 470 330 466 348 466
    L 790 466
    Q 800 466 800 476
    L 800 532
    Q 800 544 788 546
    C 730 556 686 572 664 600
    L 664 650
    C 686 662 716 676 744 690
    Q 756 696 756 710
    L 756 744
    Q 756 756 744 756
    L 280 756
    Q 268 756 268 744
    L 268 710
    Q 268 696 280 690
    C 308 676 338 662 360 650
    L 360 600
    C 340 574 300 558 262 548
    C 236 540 222 520 214 500
    Q 210 482 236 478 Z"/>
</svg>
