name: desktop

on:
  push:
    branches: [main]
    # A version tag (v1.2.3) also creates a *draft* GitHub release with the
    # installers. Nothing is public until the draft is published by hand.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Scanner tests
        run: npm test

      - name: Build and package (unsigned)
        run: npm run dist -w @agent-forge/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Smoke test packaged app
        if: runner.os != 'Linux'
        run: node apps/desktop/scripts/smoke.mjs --packaged

      # The runner is Apple Silicon; the Intel build runs under Rosetta, which
      # the runner image does not always include. Rosetta inside the CI VM is
      # slow and flaky, so this check is informational (it passes on real Macs).
      - name: Smoke test packaged app (macOS Intel)
        if: runner.os == 'macOS'
        continue-on-error: true
        env:
          SMOKE_TIMEOUT_MS: "300000"
        run: |
          /usr/bin/pgrep -q oahd || softwareupdate --install-rosetta --agree-to-license
          node apps/desktop/scripts/smoke.mjs --packaged --arch x64

      # Ubuntu 24.04 restricts unprivileged user namespaces, which Chromium's
      # sandbox needs; CI-only workaround. Xvfb provides a display.
      - name: Smoke test packaged app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a node apps/desktop/scripts/smoke.mjs --packaged --no-sandbox

      - uses: actions/upload-artifact@v7
        with:
          name: agent-forge-${{ runner.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
          if-no-files-found: error
          retention-days: 7

  release:
    name: draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Tag must match the app version
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## \\[?"v"\\]?" {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "No CHANGELOG.md section for ${GITHUB_REF_NAME}"; exit 1; }

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --title "Agent Forge ${GITHUB_REF_NAME#v}" --notes-file notes.md

