name: Feature request / 기능 제안
description: Suggest an idea / 아이디어 제안
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do? / 무엇을 하려고 하나요?
      description: The problem first, then your idea. / 해결하고 싶은 문제를 먼저, 그다음 아이디어를 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea / 아이디어
  - type: markdown
    attributes:
      value: |
        Agent Forge never calls AI APIs itself, never handles CLI logins or tokens, and runs only on your computer (no accounts, no cloud sync).
        Agent Forge는 AI를 직접 호출하지 않고, 로그인·토큰을 다루지 않으며, 내 컴퓨터 안에서만 동작합니다 (계정·클라우드 동기화 없음).
